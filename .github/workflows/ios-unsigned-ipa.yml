name: Build unsigned iOS IPA

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: unsigned-ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Show build tool versions
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
          node --version
          npm --version
          pod --version

      - name: Prepare Expo assets
        run: |
          mkdir -p assets
          cp icon.png splash-icon.png favicon.png assets/
          cp android-icon-*.png assets/

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --verbose

      - name: Build without signing
        working-directory: ios
        run: |
          set -o pipefail
          WORKSPACE=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE" || { echo "No Xcode workspace found" >&2; exit 1; }

          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list \
            | awk '/Schemes:/{getline; gsub(/^[[:space:]]+|[[:space:]]+$/, ""); print; exit}')
          test -n "$SCHEME" || { echo "No Xcode scheme found" >&2; exit 1; }
          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee ../xcodebuild.log

          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP" || { echo "No Release .app was produced" >&2; exit 1; }
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload ../WerewolfDealer-unsigned.ipa

      - name: Upload IPA and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: werewolf-dealer-unsigned-ipa
          if-no-files-found: warn
          path: |
            WerewolfDealer-unsigned.ipa
            xcodebuild.log
