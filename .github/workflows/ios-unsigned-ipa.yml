name: iOS unsigned IPA
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Prepare Expo assets
        run: |
          mkdir -p assets
          cp icon.png splash-icon.png favicon.png assets/
          cp android-icon-*.png assets/
      - run: npm ci
      - run: npx expo prebuild --platform ios --clean
      - name: Install CocoaPods dependencies
        run: npx pod-install ios
      - name: Build without signing
        working-directory: ios
        run: |
          set -o pipefail
          APP=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit | sed 's#^./##; s/.xcworkspace$//')
          test -n "$APP" || { echo "No Xcode workspace found" >&2; exit 1; }
          xcodebuild -workspace "$APP.xcworkspace" -list
          xcodebuild -workspace "$APP.xcworkspace" -scheme "$APP" -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' AD_HOC_CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ../xcodebuild.log
          mkdir Payload && cp -R "build/Build/Products/Release-iphoneos/$APP.app" Payload/
          zip -qr ../WerewolfDealer-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipa
          path: |
            WerewolfDealer-unsigned.ipa
            xcodebuild.log
